{{- if .Values.networkPolicy.enabled }}
# Service : entrée depuis Open WebUI ; sortie vers DNS, l'API du cluster, GitLab et les pods de session.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "myskills.name" . }}
  labels: {{- include "myskills.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: myskills-remote, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: open-webui, app.kubernetes.io/instance: {{ .Release.Name }}}
        {{- if .Values.viewer.enabled }}
        # Visionneuse des fichiers : navigateurs via le contrôleur d'Ingress (lien signé exigé).
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}}
        {{- end }}
      ports: [{port: {{ .Values.service.port }}}]
  egress:
    {{- include "myskills.dnsEgress" . | nindent 4 }}
    - to:
        {{- range .Values.kubernetes.apiCidrs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        {{- range .Values.kubernetes.apiPorts }}
        - port: {{ . }}
        {{- end }}
    {{- include "myskills.gitlabEgress" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels: {app: myskills-session}
      ports: [{port: 8765}]
---
# Pods de session : entrée depuis le service ; sortie vers DNS, GitLab et LiteLLM (hors du cluster).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "myskills.name" . }}-sessions
  labels: {{- include "myskills.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: myskills-session}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: myskills-remote, app.kubernetes.io/instance: {{ .Release.Name }}}
      ports: [{port: 8765}]
  egress:
    {{- include "myskills.dnsEgress" . | nindent 4 }}
    {{- include "myskills.gitlabEgress" . | nindent 4 }}
    - to:
        {{- range .Values.litellm.cidrs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports: [{port: {{ .Values.litellm.port }}}]
{{- end }}
