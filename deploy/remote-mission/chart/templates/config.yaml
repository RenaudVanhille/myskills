apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myskills.name" . }}-config
  labels: {{- include "myskills.labels" . | nindent 4 }}
data:
  remote.json: |
    {{- include "myskills.remoteJson" . | nindent 4 }}
  opencode.json: |
    {{- include "myskills.opencodeJson" . | nindent 4 }}
  models.json: |
    {{- include "myskills.modelsJson" . | nindent 4 }}
