# Missions à distance (skill remote-mission), namespace myskills : le service est toujours prêt
# (léger : HTTP, droits, création des Jobs) ; chaque tour tourne dans un Job, pod à la demande
# qui ne voit que sa mission, effacé après le tour.
# Secrets créés à part, jamais dans ce fichier (voir references/deploiement.md) :
#   myskills-remote : MYSKILLS_REMOTE_TOKEN (jeton du pipe Open WebUI),
#                     GITLAB_ACCESS_TOKEN (read_api : droits par mission)
#   myskills-turn   : ANTHROPIC_AUTH_TOKEN (clé virtuelle LiteLLM propre aux tours)
#   myskills-git    : .git-credentials (jeton GitLab write_repository ; un Secret par mission
#                     possible : missions.<nom>.git_secret)
apiVersion: v1
kind: ConfigMap
metadata:
  name: myskills-remote
  namespace: myskills
data:
  remote.json: |
    {
      "missions": {
        "portail-sinistres": {
          "repo": "https://gitlab.exemple.local/archi/portail-sinistres.git",
          "base": "main",
          "title": "Mission portail sinistres",
          "web": "https://gitlab.exemple.local/archi/portail-sinistres"
        }
      },
      "workdir": "/work",
      "branch_prefix": "openwebui/",
      "allowed_hosts": [
        "gitlab.exemple.local",
        "litellm.litellm.svc.cluster.local"
      ],
      "access": {
        "provider": "gitlab",
        "api": "https://gitlab.exemple.local/api/v4",
        "token_env": "GITLAB_ACCESS_TOKEN",
        "read_level": 20,
        "write_level": 30
      },
      "agent": {
        "command": [
          "claude",
          "-p",
          "{prompt}",
          "--output-format",
          "text",
          "--permission-mode",
          "acceptEdits",
          "--allowedTools",
          "Bash(uv run:*)",
          "Bash(python:*)",
          "Read",
          "Write",
          "Edit",
          "Glob",
          "Grep",
          "Skill",
          "Agent"
        ],
        "timeout": 5400,
        "env": {
          "ANTHROPIC_BASE_URL": "http://litellm.litellm.svc.cluster.local:4000",
          "ANTHROPIC_DEFAULT_HAIKU_MODEL": "claude-haiku",
          "ANTHROPIC_DEFAULT_SONNET_MODEL": "claude-sonnet",
          "ANTHROPIC_DEFAULT_OPUS_MODEL": "claude-opus",
          "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
          "DISABLE_AUTOUPDATER": "1"
        }
      },
      "git": {
        "name": "myskills-remote",
        "email": "myskills-remote@exemple.local"
      },
      "server": {
        "host": "0.0.0.0",
        "port": 8765,
        "token_env": "MYSKILLS_REMOTE_TOKEN",
        "max_jobs": 4
      },
      "runner": {
        "kind": "kubernetes",
        "image": "registry.exemple.local/myskills/remote-mission:2.4.0",
        "secret": "myskills-turn",
        "git_secret": "myskills-git",
        "config_map": "myskills-remote",
        "ttl_seconds": 900,
        "resources": {
          "requests": {
            "cpu": "500m",
            "memory": "1Gi"
          },
          "limits": {
            "memory": "4Gi"
          }
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: myskills-remote
  namespace: myskills
---
# Le service ne gère que les Jobs des tours et lit les journaux de leurs pods, dans son namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: myskills-remote
  namespace: myskills
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: myskills-remote
  namespace: myskills
subjects:
  - kind: ServiceAccount
    name: myskills-remote
    namespace: myskills
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: myskills-remote
---
# Plafond des tours en parallèle dans le namespace (en plus de server.max_jobs).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: myskills-tours
  namespace: myskills
spec:
  hard:
    count/jobs.batch: "20"
    limits.memory: 24Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myskills-remote
  namespace: myskills
spec:
  replicas: 1            # suivi des tours en mémoire ; un Job encore actif est retrouvé après un redémarrage
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: myskills-remote}
  template:
    metadata:
      labels: {app: myskills-remote}
    spec:
      serviceAccountName: myskills-remote
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: service
          image: registry.exemple.local/myskills/remote-mission:2.4.0
          ports:
            - containerPort: 8765
          envFrom:
            - secretRef: {name: myskills-remote}
          readinessProbe:
            httpGet: {path: /health, port: 8765}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/myskills, readOnly: true}
      volumes:
        - name: config
          configMap: {name: myskills-remote}
---
apiVersion: v1
kind: Service
metadata:
  name: myskills-remote
  namespace: myskills
spec:
  selector: {app: myskills-remote}
  ports:
    - port: 8765
      targetPort: 8765
---
# Service : entrée depuis Open WebUI seulement ; sortie vers DNS, l'API du cluster et l'API GitLab.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myskills-remote
  namespace: myskills
spec:
  podSelector:
    matchLabels: {app: myskills-remote}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: open-webui}
          podSelector:
            matchLabels: {app.kubernetes.io/name: open-webui}
      ports:
        - port: 8765
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock: {cidr: 10.0.0.1/32}    # adresse de l'API du cluster (kubectl get endpoints kubernetes)
      ports:
        - port: 443
        - port: 6443
    - to:
        - ipBlock: {cidr: 10.0.0.10/32}   # GitLab (ou son namespace s'il tourne dans le cluster)
      ports:
        - port: 443
---
# Pods des tours : aucune entrée ; sortie vers DNS, LiteLLM et GitLab seulement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myskills-tours
  namespace: myskills
spec:
  podSelector:
    matchLabels: {app: myskills-turn}
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: litellm}
          podSelector:
            matchLabels: {app.kubernetes.io/name: litellm}
      ports:
        - port: 4000
    - to:
        - ipBlock: {cidr: 10.0.0.10/32}   # GitLab
      ports:
        - port: 443
        - port: 22
