# Missions à distance (skill remote-mission), namespace myskills.
# Service frontal toujours prêt (léger : HTTP, droits, pods de session). Chaque conversation a son
# pod de session, qui garde le contexte de l'agent, s'arrête après runner.idle_minutes sans message
# et se recharge depuis son volume (PVC) quand l'utilisateur revient ; « /fin » efface pod et volume.
# Secrets créés à part, jamais dans ce fichier (voir references/deploiement.md) :
#   myskills-remote  : MYSKILLS_REMOTE_TOKEN (jeton du pipe Open WebUI),
#                      GITLAB_ACCESS_TOKEN (read_api : droits par mission)
#   myskills-session : ANTHROPIC_AUTH_TOKEN (clé virtuelle LiteLLM propre aux sessions)
#                      GITLAB_ACCESS_TOKEN (droits relus avant chaque pull et push)
#   myskills-git     : .git-credentials (jeton GitLab write_repository ; un Secret par mission
#                      possible : missions.<nom>.git_secret)
apiVersion: v1
kind: ConfigMap
metadata:
  name: myskills-remote
  namespace: myskills
data:
  remote.json: |
    {
      "missions": {},
      "discovery": {
        "topic": "myskills-mission",
        "group": "archi",
        "title": "Missions myskills"
      },
      "workdir": "/work/clones",
      "branch_prefix": "openwebui/",
      "allowed_hosts": [
        "gitlab.exemple.local",
        "litellm.litellm.svc.cluster.local"
      ],
      "access": {
        "provider": "gitlab",
        "api": "https://gitlab.exemple.local/api/v4",
        "token_env": "GITLAB_ACCESS_TOKEN",
        "read_level": 20,
        "write_level": 30
      },
      "agent": {
        "command": [
          "claude",
          "-p",
          "{prompt}",
          "--output-format",
          "text",
          "--permission-mode",
          "acceptEdits",
          "--allowedTools",
          "Bash(uv run:*)",
          "Bash(python:*)",
          "Read",
          "Write",
          "Edit",
          "Glob",
          "Grep",
          "Skill",
          "Agent"
        ],
        "timeout": 5400,
        "env": {
          "ANTHROPIC_BASE_URL": "http://litellm.litellm.svc.cluster.local:4000",
          "ANTHROPIC_DEFAULT_HAIKU_MODEL": "claude-haiku",
          "ANTHROPIC_DEFAULT_SONNET_MODEL": "claude-sonnet",
          "ANTHROPIC_DEFAULT_OPUS_MODEL": "claude-opus",
          "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
          "DISABLE_AUTOUPDATER": "1"
        },
        "continue_args": [
          "--continue"
        ]
      },
      "git": {
        "name": "myskills-remote",
        "email": "myskills-remote@exemple.local"
      },
      "server": {
        "host": "0.0.0.0",
        "port": 8765,
        "token_env": "MYSKILLS_REMOTE_TOKEN",
        "max_jobs": 4
      },
      "runner": {
        "kind": "kubernetes",
        "image": "registry.exemple.local/myskills/remote-mission:2.4.0",
        "secret": "myskills-session",
        "git_secret": "myskills-git",
        "config_map": "myskills-remote",
        "idle_minutes": 120,
        "session_size": "5Gi",
        "retention_days": 14,
        "resources": {
          "requests": {
            "cpu": "250m",
            "memory": "1Gi"
          },
          "limits": {
            "memory": "4Gi"
          }
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: myskills-remote
  namespace: myskills
---
# Le service ne gère que les pods et volumes des sessions, dans son namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: myskills-remote
  namespace: myskills
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: myskills-remote
  namespace: myskills
subjects:
  - kind: ServiceAccount
    name: myskills-remote
    namespace: myskills
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: myskills-remote
---
# Plafond des sessions ouvertes en même temps dans le namespace.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: myskills-tours
  namespace: myskills
spec:
  hard:
    pods: "21"                      # 20 sessions + le service
    persistentvolumeclaims: "100"
    requests.storage: 500Gi
    limits.memory: 84Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myskills-remote
  namespace: myskills
spec:
  replicas: 1            # les sessions vivent dans leurs pods : un redémarrage du service les retrouve
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: myskills-remote}
  template:
    metadata:
      labels: {app: myskills-remote}
    spec:
      serviceAccountName: myskills-remote
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: service
          image: registry.exemple.local/myskills/remote-mission:2.4.0
          ports:
            - containerPort: 8765
          envFrom:
            - secretRef: {name: myskills-remote}
          readinessProbe:
            httpGet: {path: /health, port: 8765}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/myskills, readOnly: true}
      volumes:
        - name: config
          configMap: {name: myskills-remote}
---
apiVersion: v1
kind: Service
metadata:
  name: myskills-remote
  namespace: myskills
spec:
  selector: {app: myskills-remote}
  ports:
    - port: 8765
      targetPort: 8765
---
# Service : entrée depuis Open WebUI seulement ; sortie vers DNS, l'API du cluster, l'API GitLab et les pods de session.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myskills-remote
  namespace: myskills
spec:
  podSelector:
    matchLabels: {app: myskills-remote}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: open-webui}
          podSelector:
            matchLabels: {app.kubernetes.io/name: open-webui}
      ports:
        - port: 8765
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock: {cidr: 10.0.0.1/32}    # adresse de l'API du cluster (kubectl get endpoints kubernetes)
      ports:
        - port: 443
        - port: 6443
    - to:
        - ipBlock: {cidr: 10.0.0.10/32}   # GitLab (ou son namespace s'il tourne dans le cluster)
      ports:
        - port: 443
    - to:
        - podSelector:
            matchLabels: {app: myskills-session}
      ports:
        - port: 8765
---
# Pods de session : entrée depuis le service seulement ; sortie vers DNS, LiteLLM et GitLab.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myskills-sessions
  namespace: myskills
spec:
  podSelector:
    matchLabels: {app: myskills-session}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: myskills-remote}
      ports:
        - port: 8765
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: litellm}
          podSelector:
            matchLabels: {app.kubernetes.io/name: litellm}
      ports:
        - port: 4000
    - to:
        - ipBlock: {cidr: 10.0.0.10/32}   # GitLab
      ports:
        - port: 443
        - port: 22
