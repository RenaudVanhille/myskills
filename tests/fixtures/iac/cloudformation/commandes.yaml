AWSTemplateFormatVersion: "2010-09-09"
Description: Prise de commandes (gabarit de test)
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: api-commandes
  Orders:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: commandes
      Runtime: python3.12
      Handler: app.handler
      Role: !GetAtt OrdersRole.Arn
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet
      Environment:
        Variables:
          QUEUE_URL: !Ref OrdersQueue
          TABLE: !Ref OrdersTable
  OrdersRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {}
  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: commandes
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: commandes
  Worker:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: preparation
      Runtime: python3.12
      Handler: worker.handler
      Role: !GetAtt OrdersRole.Arn
  WorkerSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt OrdersQueue.Arn
      FunctionName: !Ref Worker
  Invoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Orders
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"
