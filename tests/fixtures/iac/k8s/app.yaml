apiVersion: v1
kind: Namespace
metadata:
  name: boutique
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: shop, namespace: boutique}
spec:
  rules:
    - host: shop.exemple.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: api, port: {number: 80}}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: boutique}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: boutique}
spec:
  replicas: 3
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: api:1.0
          envFrom: [{configMapRef: {name: api}}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: api, namespace: boutique}
data: {LOG: info}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api, namespace: boutique}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: donnees}
spec:
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers: [{name: pg, image: postgres:16}]
  volumeClaimTemplates:
    - metadata: {name: data}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: lecture, namespace: boutique}
