# Modèle utilisé par chaque niveau d'agent, pour chaque outil.
# Format : outil.niveau=modèle. Une valeur vide laisse l'outil choisir
# (modèle de la session, ou routage automatique quand l'outil en a un).
# Relancez scripts/install.sh après modification.

# Claude Code : des alias, que Claude Code résout vers la dernière version
# disponible. Videz-les pour garder le modèle de la session partout.
claude.simple=haiku
claude.moyen=sonnet
claude.complexe=opus

# OpenCode : vide = modèle de la session. Pour activer les niveaux, indiquez
# fournisseur/modèle selon vos fournisseurs (voir `opencode models`).
opencode.simple=
opencode.moyen=
opencode.complexe=

# Kiro : vide = mode Auto, qui choisit déjà le modèle selon la tâche.
kiro.simple=
kiro.moyen=
kiro.complexe=
