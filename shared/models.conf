# Modèle utilisé par chaque niveau d'agent, pour chaque outil.
# Format : outil.niveau=modèle. Une valeur vide garde le modèle de la session.
# Relancez scripts/install.sh après modification.

# Claude Code : alias haiku, sonnet, opus (ou un identifiant complet).
claude.simple=haiku
claude.moyen=sonnet
claude.complexe=opus

# OpenCode : fournisseur/modèle.
opencode.simple=anthropic/claude-haiku-5-5
opencode.moyen=anthropic/claude-sonnet-5-5
opencode.complexe=anthropic/claude-opus-5-5

# Kiro : identifiants de la page « Available models » de Kiro.
kiro.simple=
kiro.moyen=
kiro.complexe=
