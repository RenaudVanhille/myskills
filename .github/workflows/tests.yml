# Cas rapides de tests/run.py (contrats, règles d'AGENTS.md, scripts des skills)
# sous Linux, macOS et Windows, à chaque PR et sur main. Aucun modèle, aucun secret.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # Version stable : une préversion de Python n'a pas toujours les roues
          # des dépendances (onnxruntime pour MarkItDown).
          python-version: "3.13"
      - name: Tests des scripts
        run: uv run tests/run.py

  # Cas lents de run.py (navigateur, Pandoc, Docling, Laya) et export réel par
  # draw.io Desktop, sous Linux : ce que le conteneur de développement ne peut
  # pas télécharger.
  rendus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: draw.io Desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo jgraph/drawio-desktop --pattern 'drawio-amd64-*.deb' --dir "$RUNNER_TEMP"
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb "$RUNNER_TEMP"/drawio-amd64-*.deb
          printf '#!/bin/sh\nexec xvfb-run -a /opt/drawio/drawio "$@" --no-sandbox\n' | sudo tee /usr/local/bin/drawio
          sudo chmod +x /usr/local/bin/drawio
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ms-playwright
            ~/.cache/myskills/models
          key: modeles-${{ hashFiles('skills/requirements-catalog/scripts/req_laya.py', 'skills/doc-to-markdown/scripts/*.py', 'shared/model-sources.json') }}
      - name: Sources épinglées des modèles locaux
        run: uv run scripts/pin_model.py --check
      - name: Modèles locaux préparés avant les runs (aucun téléchargement pendant un traitement)
        run: uv run skills/check-prerequisites/scripts/doctor.py extraction --prefetch
      - name: Tests lents et exports draw.io
        run: uv run tests/run.py --slow
      - name: Justesse de Laya sur les exigences
        run: |
          uv run tests/laya_eval.py --markdown laya-eval.md --min-gain 0.01 > laya-eval.json
          tee -a "$GITHUB_STEP_SUMMARY" < laya-eval.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laya-eval
          path: laya-eval.*
          if-no-files-found: ignore
