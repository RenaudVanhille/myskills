# Cas rapides de tests/run.py (contrats, règles d'AGENTS.md, scripts des skills)
# sous Linux, macOS et Windows, à chaque PR et sur main. Aucun modèle, aucun secret.
#
# Runners : variables du dépôt (Settings > Secrets and variables > Actions >
# Variables), en JSON, pour des runners auto-hébergés ; sans elles, runners
# GitHub. Aucune étape n'utilise la CLI gh (absente des runners privés).
#   RUNNERS_SCRIPTS : liste des runners de la matrice,
#     ex. [["self-hosted","linux"],["self-hosted","windows"]]
#   RUNNER_LINUX : runner Linux des rendus (Ubuntu 24.04, sudo et apt), ex. ["self-hosted","linux"]
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.RUNNERS_SCRIPTS || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # Version stable : une préversion de Python n'a pas toujours les roues
          # des dépendances (onnxruntime pour MarkItDown).
          python-version: "3.13"
      - name: Tests des scripts
        run: uv run tests/run.py

  # Cas lents de run.py (navigateur, Pandoc, Docling) et export réel par
  # draw.io Desktop, sous Linux : ce que le conteneur de développement ne peut
  # pas télécharger.
  rendus:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: draw.io Desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Dernière release par l'API REST (curl et python3), sans la CLI gh.
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/jgraph/drawio-desktop/releases/latest \
            | python3 -c 'import json, re, sys; print(next(a["browser_download_url"] for a in json.load(sys.stdin)["assets"] if re.fullmatch(r"drawio-amd64-.*\.deb", a["name"])))')
          curl -fsSL -o "$RUNNER_TEMP/$(basename "$url")" "$url"
          sudo apt-get update -q
          # libasound2t64 (draw.io) et libatomic1 (pilote Node de Playwright) : présents sur les runners
          # GitHub, absents d'une image minimale de runner auto-hébergé.
          sudo apt-get install -y -q xvfb tesseract-ocr tesseract-ocr-fra libasound2t64 libatomic1 \
            "$RUNNER_TEMP"/drawio-amd64-*.deb
          # --disable-gpu et --disable-dev-shm-usage : pas de GPU et un /dev/shm réduit dans un conteneur.
          printf '#!/bin/sh\nexec xvfb-run -a /opt/drawio/drawio "$@" --no-sandbox --disable-gpu --disable-dev-shm-usage\n' | sudo tee /usr/local/bin/drawio
          sudo chmod +x /usr/local/bin/drawio
      - name: Contrôle de draw.io
        # Un export à blanc, sortie complète : le rapport d'export.py n'en garde que la fin.
        run: |
          printf '<mxfile><diagram name="t"><mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/><mxCell id="2" value="ok" style="rounded=1;" vertex="1" parent="1"><mxGeometry x="20" y="20" width="80" height="40" as="geometry"/></mxCell></root></mxGraphModel></diagram></mxfile>' > "$RUNNER_TEMP/t.drawio"
          drawio --export --format png --output "$RUNNER_TEMP/t.png" "$RUNNER_TEMP/t.drawio" \
            || echo "::warning::draw.io n'exporte pas sur ce runner (code $?)"
          ls -l "$RUNNER_TEMP/t.png" || true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ms-playwright
            ~/.cache/myskills/models
          key: modeles-${{ hashFiles('skills/doc-to-markdown/scripts/*.py', 'shared/model-sources.json') }}
      - name: Navigateur de Playwright
        # Chromium et ses bibliothèques système : un runner auto-hébergé n'a ni Chrome ni Edge.
        # Chemin fixé : un cas de test qui déplace XDG_CACHE_HOME retrouve quand même Chromium.
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          uvx playwright install --with-deps chromium
      - name: Sources épinglées des modèles locaux
        run: uv run scripts/pin_model.py --check
      - name: Modèles locaux préparés avant les runs (aucun téléchargement pendant un traitement)
        run: uv run skills/check-prerequisites/scripts/doctor.py extraction --prefetch
      - name: Justesse du tri des documents
        # Tri enregistré d'un modèle léger, sur le jeu étiqueté : aucun modèle chargé.
        run: |
          uv run tests/classify_eval.py --markdown doc-eval.md --min-accuracy 0.9
          cat doc-eval.md >> "$GITHUB_STEP_SUMMARY"
      - name: Tests lents et exports draw.io
        run: uv run tests/run.py --slow
      - name: Justesse du tri des phrases d'exigence
        # Tri enregistré d'un modèle léger face à la regex, sur le jeu étiqueté : aucun modèle chargé.
        run: |
          uv run tests/triage_eval.py --markdown tri-eval.md --min-f1 0.9
          cat tri-eval.md >> "$GITHUB_STEP_SUMMARY"

  # Chart Helm des missions à distance : lint, rendu (agent OpenCode puis Claude Code, autorité interne, Foundry),
  # configuration générée validée par remote_server.py check.
  deploiement:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Chart myskills-remote
        run: |
          chart=deploy/remote-mission/chart
          helm lint "$chart"
          foundry="--set llm.provider=foundry --set foundry.resource=essai --set foundry.cidrs={10.1.0.5/32}"
          for options in "" "--set agent.kind=claude --set caSecret=autorite-interne --set openWebui.enabled=false" \
                         "$foundry" "$foundry --set agent.kind=claude"; do
            helm template myskills "$chart" -n myskills $options > "$RUNNER_TEMP/rendu.yaml"
            uv run --with pyyaml python -c 'import sys, yaml; cm = next(d for d in yaml.safe_load_all(open(sys.argv[1])) if d and d["kind"] == "ConfigMap" and "remote.json" in d["data"]); open(sys.argv[2], "w", encoding="utf-8").write(cm["data"]["remote.json"])' "$RUNNER_TEMP/rendu.yaml" "$RUNNER_TEMP/remote.json"
            uv run deploy/remote-mission/service/scripts/remote_server.py check --config "$RUNNER_TEMP/remote.json"
          done
          # docker-compose du dev local : syntaxe et variables (sans construire ni lancer).
          if command -v docker > /dev/null && docker compose version > /dev/null 2>&1; then
            cp deploy/remote-mission/dev/.env.example deploy/remote-mission/dev/.env
            docker compose -f deploy/remote-mission/dev/compose.yaml config --quiet
          fi
